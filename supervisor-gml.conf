[program:gml-api]
directory=/home/container/gml/api
command=/home/container/bin/dotnet /home/container/gml/api/Gml.Web.Api.dll
autostart=true
autorestart=true
startsecs=5
priority=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/container",TMPDIR="/home/container/tmp",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",DOTNET_ROOT="/usr/share/dotnet",ASPNETCORE_HTTP_PORTS="",ASPNETCORE_ENVIRONMENT="Production",ASPNETCORE_URLS="http://127.0.0.1:8082",TZ="%(ENV_TZ)s",SECURITY_KEY="%(ENV_SECURITY_KEY)s",PROJECT_NAME="%(ENV_PROJECT_NAME)s",PROJECT_DESCRIPTION="%(ENV_PROJECT_DESCRIPTION)s",PROJECT_POLICYNAME="%(ENV_PROJECT_POLICYNAME)s",PROJECT_PATH="%(ENV_PROJECT_PATH)s",SWAGGER_ENABLED="%(ENV_SWAGGER_ENABLED)s",MARKET_ENDPOINT="%(ENV_MARKET_ENDPOINT)s",SERVICE_TEXTURE_ENDPOINT="%(ENV_SERVICE_TEXTURE_ENDPOINT)s"

[program:gml-client]
directory=/home/container/gml/client
command=/usr/bin/node /home/container/gml/client/server.js
autostart=true
autorestart=true
startsecs=5
priority=20
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/container",NODE_ENV="production",HOSTNAME="127.0.0.1",PORT="8081",TZ="%(ENV_TZ)s",AUTH_TRUST_HOST="true",AUTH_URL="%(ENV_AUTH_URL)s",NEXTAUTH_URL="%(ENV_NEXTAUTH_URL)s",NEXT_PUBLIC_BACKEND_URL="http://127.0.0.1:%(ENV_PUBLIC_PANEL_PORT)s/api/v1",NEXT_PUBLIC_MARKETPLACE_URL="%(ENV_MARKET_ENDPOINT)s"

[program:gml-skins]
directory=/home/container/gml/skins
command=/usr/bin/dotnet /home/container/gml/skins/Gml.Web.Skin.Service.dll
autostart=true
autorestart=true
startsecs=5
priority=30
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/container",TMPDIR="/home/container/tmp",ASPNETCORE_HTTP_PORTS="",ASPNETCORE_ENVIRONMENT="Production",ASPNETCORE_URLS="http://127.0.0.1:8085",TZ="%(ENV_TZ)s",NEXT_PUBLIC_BACKEND_URL="http://127.0.0.1:%(ENV_PUBLIC_PANEL_PORT)s/api/v1",NEXT_PUBLIC_MARKETPLACE_URL="%(ENV_MARKET_ENDPOINT)s"

[program:andline-economy]
directory=/home/container/gml/economy
command=/usr/bin/dotnet /home/container/gml/economy/Andline.Economy.dll
autostart=true
autorestart=true
startsecs=3
priority=35
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/container",TMPDIR="/home/container/tmp",ASPNETCORE_HTTP_PORTS="",ASPNETCORE_ENVIRONMENT="Production",ASPNETCORE_URLS="http://127.0.0.1:8086",TZ="%(ENV_TZ)s",SECURITY_KEY="%(ENV_SECURITY_KEY)s",JWT_ISSUER="gml-api",JWT_AUDIENCE="gml-clients",SHOP_INTERNAL_URL="%(ENV_SHOP_INTERNAL_URL)s",SHOP_INTERNAL_KEY="%(ENV_SHOP_INTERNAL_KEY)s",SHOP_INTERNAL_HEADER="%(ENV_SHOP_INTERNAL_HEADER)s"

[program:gml-proxy]
directory=/home/container/gml/proxy
command=/usr/bin/dotnet /home/container/gml/proxy/Gml.Web.Proxy.dll
autostart=true
autorestart=true
startsecs=3
priority=40
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/container",TMPDIR="/home/container/tmp",ASPNETCORE_HTTP_PORTS="",ASPNETCORE_ENVIRONMENT="Production",ASPNETCORE_URLS="http://0.0.0.0:%(ENV_PUBLIC_PANEL_PORT)s",TZ="%(ENV_TZ)s",PUBLIC_PANEL_HOST="%(ENV_PUBLIC_PANEL_HOST)s",AUTH_URL="%(ENV_AUTH_URL)s"

[program:newt]
command=/opt/gml/newt-wrapper.sh
autostart=true
autorestart=true
startsecs=2
priority=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/home/container",PANGOLIN_ENDPOINT="%(ENV_PANGOLIN_ENDPOINT)s",NEWT_ID="%(ENV_NEWT_ID)s",NEWT_SECRET="%(ENV_NEWT_SECRET)s"
